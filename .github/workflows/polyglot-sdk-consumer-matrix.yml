name: Claritas SDK source-free admission

# Private SDK source is NEVER checked out in this public repository.
# An independently approved PRIVATE exact-tree carrier must perform all
# actual native language tests. This workflow validates metadata only.
on:
  pull_request:
    paths:
      - '.github/workflows/polyglot-sdk-consumer-matrix.yml'
      - 'ci/sdk-source-free-admission.json'
      - 'ci/sdk-lane-readiness.json'
      - 'ci/sdk-native-coverage-plan.json'
      - 'scripts/check-sdk-source-free-admission.mjs'
      - 'scripts/check-sdk-source-free-admission.test.mjs'
  workflow_dispatch:
  repository_dispatch:
    types: [clients-repository-ready, clients-updated]

permissions:
  contents: read

jobs:
  source-free-contract:
    name: Source-free SDK metadata contract (NOT integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this public test repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Set up Node.js for dependency-free metadata tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Execute positive and negative source-free admission tests
        run: node --test scripts/check-sdk-source-free-admission.test.mjs
      - name: Validate immutable metadata snapshot and no private checkout
        run: node scripts/check-sdk-source-free-admission.mjs --check
      - name: Prove a private SDK execution request is denied
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result="$(node scripts/check-sdk-source-free-admission.mjs --require-private 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0 || { echo "Unexpected successful private admission"; exit 1; }
          case "$result" in
            *PRIVATE_SDK_SOURCE_NOT_AUTHORIZED*) echo "PRIVATE_EXECUTION_DENIED_PASS" ;;
            *) echo "Expected denial marker missing"; exit 1 ;;
          esac


  private-integration-denied:
    name: BLOCKED - no public private-source execution
    if: github.event_name != 'pull_request'
    needs: source-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Deny without independently approved private exact-tree carrier
        run: node scripts/check-sdk-source-free-admission.mjs --require-private
